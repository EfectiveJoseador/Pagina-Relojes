<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Luxe MOD Watches</title>
    <meta name="description"
        content="Contáctanos para cualquier duda sobre nuestros relojes de lujo. Atención personalizada.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://luxemodwatches.com/pages/contacto.html">

    <link rel="icon" type="image/x-icon" href="../assets/logo/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content" style="min-height: 80vh; background: var(--bg-body); padding: 4rem 1.5rem;">
        <div class="auth-container" style="min-height: auto; align-items: flex-start; padding: 0;">
            <div class="auth-card" style="max-width: 600px; margin: 0 auto; animation: slideUp 0.8s ease backwards;">
                <h1
                    style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 2rem; text-align: center;">
                    Contáctanos</h1>

                <p style="color: var(--text-muted); text-align: center; margin-bottom: 2.5rem;">
                    ¿Tienes alguna pregunta o necesitas asistencia? Completa el formulario o escríbenos directamente.
                </p>

                <form id="contactForm" class="auth-form active" style="display: block;">
                    
                    <input type="hidden" name="access_key" value="e7d55d3d-14d8-47b5-a3ee-e5216b7bd3e2">
                    <input type="hidden" name="subject" value="Nuevo Mensaje de Contacto - Luxe MOD">
                    <input type="hidden" name="from_name" value="Luxe MOD Contact Form">
                    
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <div class="form-group">
                        <label for="name">Nombre</label>
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <div class="input-icon">
                            <i class="fas fa-comment-alt" style="top: 1rem; transform: none;"></i>
                            <textarea id="message" name="message" placeholder="¿En qué podemos ayudarte?" required
                                style="width: 100%; min-height: 120px; padding: 0.8rem 1rem 0.8rem 2.8rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-family: var(--font-main); resize: vertical;"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        <i class="fas fa-paper-plane" style="margin-right: 0.5rem;"></i> Enviar Mensaje
                    </button>
                    <p id="formStatus" style="margin-top: 1rem; text-align: center; font-size: 0.9rem;"></p>
                </form>

                <div
                    style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); text-align: center;">
                    <h3 style="font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 1rem;">Otras formas
                        de contacto</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
                        <a href="mailto:luxemodwatches@gmail.com"
                            style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s;">
                            <i class="fas fa-envelope" style="color: #D4AF37;"></i> luxemodwatches@gmail.com
                        </a>
                        <a href="https://www.instagram.com/luxemodwatches/" target="_blank"
                            style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s;">
                            <i class="fab fa-instagram" style="color: #D4AF37;"></i> @luxemodwatches
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    <script>
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('formStatus');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            submitBtn.disabled = true;
            statusText.innerText = "";

            const formData = new FormData(form);

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirect on success similar to checkout
                    window.location.href = "/pages/mensaje-enviado.html";
                } else {
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    statusText.innerText = "Error al enviar: " + (data.message || "Inténtalo de nuevo.");
                    statusText.style.color = "#ef4444";
                }
            } catch (error) {
                console.error("Error:", error);
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                statusText.innerText = "Error de conexión. Verifica tu internet.";
                statusText.style.color = "#ef4444";
            }
        });
    </script>
</body>

</html>
