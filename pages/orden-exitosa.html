<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Realizado con Éxito! | Luxe MOD Watches</title>
    <link rel="icon" type="image/x-icon" href="../assets/logo/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content"
        style="min-height: 80vh; background: var(--bg-body); padding: 4rem 1.5rem; display: flex; align-items: center; justify-content: center;">
        <div class="auth-card"
            style="max-width: 600px; width: 100%; margin: 0 auto; text-align: center; animation: slideUp 0.8s ease backwards;">
            <div style="font-size: 4rem; color: #D4AF37; margin-bottom: 2rem;">
                <i class="fas fa-shopping-bag"></i>
            </div>

            <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 1rem;">¡Gracias por tu
                Pedido!</h1>

            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2.5rem; line-height: 1.6;">
                Hemos recibido tu pedido correctamente. En breve recibirás un correo electrónico con los detalles y la
                confirmación.
            </p>

            <a href="/index.html" class="btn btn-primary" style="padding: 1rem 3rem;">
                Seguir Comprando
            </a>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
</body>

</html>
