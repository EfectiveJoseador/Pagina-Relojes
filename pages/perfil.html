<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/logo/logo.png">
    <title>Mi Cuenta - Luxe MOD Watches</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GS53GWE2Z0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-GS53GWE2Z0');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content" style="min-height: 80vh; background: var(--bg-body);">
        <div class="profile-container">
            
            <aside class="profile-sidebar">
                <div class="user-info">
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="profile-email" style="font-size: 1rem; color: var(--text-main); word-break: break-all;">
                        Cargando...</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Miembro Luxe</p>
                </div>

                <nav class="profile-nav">
                    <div class="nav-item active" data-target="orders-section">
                        <i class="fas fa-box"></i> Mis Pedidos
                    </div>
                    <div class="nav-item" data-target="addresses-section">
                        <i class="fas fa-map-marker-alt"></i> Direcciones
                    </div>
                    <div class="nav-item logout" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </div>
                </nav>
            </aside>

            
            <section class="profile-content">

                
                <div id="orders-section" class="content-section active">
                    <h2>Mis Pedidos</h2>
                    <div class="orders-list">
                        


                        <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                            <p>Aún no tienes pedidos.</p>
                            <a href="/pages/tienda.html" class="btn-shop-now" style="margin-top: 1rem;">
                                Ir a la Tienda
                            </a>
                        </div>
                    </div>
                </div>

                
                <div id="addresses-section" class="content-section">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h2>Mis Direcciones</h2>
                        <button class="btn-add-address" id="btn-new-address">
                            <i class="fas fa-plus"></i> Nueva
                        </button>
                    </div>

                    <div class="address-list">
                        <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                            <p>No tienes direcciones guardadas.</p>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    
    <script type="module" src="/js/profile.js"></script>

    
    <div class="modal" id="address-modal" style="display: none;">
        <div class="modal-content auth-card" style="max-width: 500px; margin: 2rem auto; position: relative;">
            <button class="btn-text" id="close-address-modal" style="position: absolute; top: 1rem; right: 1rem;">
                <i class="fas fa-times"></i>
            </button>
            <h3 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Nueva Dirección</h3>
            <form id="address-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="name" required placeholder="Juan Pérez">
                    </div>
                </div>
                <div class="form-group">
                    <label>Dirección y Número</label>
                    <div class="input-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="street" required placeholder="Calle Principal 123">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Ciudad</label>
                        <div class="input-icon">
                            <i class="fas fa-city"></i>
                            <input type="text" name="city" required placeholder="Madrid">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Código Postal</label>
                        <div class="input-icon">
                            <i class="fas fa-mail-bulk"></i>
                            <input type="text" name="zip" required placeholder="28001">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Provincia/Estado</label>
                    <div class="input-icon">
                        <i class="fas fa-map"></i>
                        <input type="text" name="province" required placeholder="Madrid">
                    </div>
                </div>
                <div class="form-group">
                    <label>País</label>
                    <div class="input-icon">
                        <i class="fas fa-globe"></i>
                        <input type="text" name="country" required placeholder="España" value="España">
                    </div>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" name="phone" required placeholder="+34 600 000 000">
                    </div>
                </div>
                <button type="submit" class="btn btn-block btn-primary">Guardar Dirección</button>
            </form>
        </div>
    </div>
</body>

</html>
