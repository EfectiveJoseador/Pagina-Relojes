<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/logo/logo.png">


    <title>Seiko Mod Exclusivo | Luxe MOD Watches</title>
    <meta name="description"
        content="Reloj Seiko Mod personalizado con cristal de zafiro y movimiento automático NH35. Calidad premium y envío rápido desde España.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://luxemodwatches.com/producto">


    <meta property="og:type" content="product">
    <meta property="og:url" content="https://luxemodwatches.com/producto">
    <meta property="og:title" content="Seiko Mod Exclusivo | Luxe MOD Watches">
    <meta property="og:description"
        content="Reloj Seiko Mod personalizado con movimiento automático y acabados de lujo.">
    <meta property="og:image" content="https://Luxe MOD Watches.shop/assets/logo/logo.png">
    <meta property="og:locale" content="es_ES">
    <meta property="product:price:amount" content="24.99">
    <meta property="product:price:currency" content="EUR">


    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GS53GWE2Z0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-GS53GWE2Z0');
    </script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family:Outfit:wght@700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css">


    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/catalogo.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/producto.css">
    <link rel="stylesheet" href="/css/badges.css">
    <link rel="stylesheet" href="/css/ux-feedback.css">


    <script type="application/ld+json" id="product-schema">
    {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "Reloj Seiko Mod",
        "image": "https://luxemodwatches.com/assets/logo/logo.png",
        "description": "Reloj Seiko Mod personalizado con movimiento automático NH35 y cristal de zafiro.",
        "brand": {
            "@type": "Brand",
            "name": "Luxe MOD Watches"
        },
        "offers": {
            "@type": "Offer",
            "url": "https://luxemodwatches.com/producto",
            "priceCurrency": "EUR",
            "price": "24.99",
            "availability": "https://schema.org/InStock",
            "seller": {
                "@type": "Organization",
                "name": "Luxe MOD Watches"
            }
        },
        "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "reviewCount": "300"
        }
    }
    </script>

    <style>
        .option-group {
            margin-bottom: 1.5rem;
        }

        .option-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .text-input,
        .select-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .text-input:focus,
        .select-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-hint {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .customization-summary {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-top: 2rem;
        }

        .summary-title {
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-size: 1rem;
        }

        .summary-content {
            font-size: 0.95rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .summary-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .summary-details {
            margin: 0.75rem 0;
            padding: 0.75rem 0;
            padding-bottom: 0;
            border-top: 1px solid var(--border);
            min-height: 2rem;
        }

        .summary-details span {
            display: block;
            padding: 0.25rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            margin-top: 0.5rem;
            border-top: 2px solid var(--border);
        }

        .total-label {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .total-value {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
        }
    </style>
</head>

<body>


    <div id="header-placeholder"></div>

    <main class="product-container">

        <nav class="breadcrumbs">
            <a href="/index.html">Inicio</a>
            <a href="/pages/tienda.html">Tienda</a>
            <a href="/pages/tienda.html" id="breadcrumb-category">Colección</a>
            <span id="breadcrumb-name">Producto</span>
        </nav>

        <div class="product-layout">

            <section class="product-gallery">
                <div class="main-image">
                    <button class="gallery-arrow gallery-arrow-left" id="prev-image">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <img id="main-img" src="" alt="Producto">
                    <button class="gallery-arrow gallery-arrow-right" id="next-image">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="thumbnails">

                </div>

                <div class="description-block"
                    style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <h3>Descripción</h3>
                    <div id="product-description" class="product-description"></div>
                    <ul id="product-features" class="features-list"></ul>
                </div>
            </section>


            <section class="product-details">
                <span id="product-category" class="category-tag">Categoría</span>
                <h1 id="product-name" class="product-title">Nombre del Producto</h1>

                <div class="price-block">
                    <span id="product-price" class="current-price">0.00</span>
                    <span id="product-old-price" class="old-price hidden">0.00</span>
                </div>

                <div class="options-block">

                    <div id="size-selector-container" class="option-group" style="display: none;">
                        <label class="option-label">Tamaño</label>
                        <div class="size-selector" id="size-selector">
                            
                        </div>
                    </div>

                    <div id="strap-selector-container" class="option-group" style="display: none;">
                        <label class="option-label">Correa</label>
                        <div class="size-selector" id="strap-selector">
                            
                        </div>
                    </div>

                    <div class="option-group">
                        <label class="option-label">Caja <span
                                style="color: var(--text-muted); font-weight: 400; font-size: 0.9rem;">Opcional</span>
                            <button type="button" class="btn-view-boxes">Ver tipos de cajas</button></label>
                        <div class="box-selector">
                            <label class="box-option">
                                <input type="radio" name="box" value="none" checked>
                                <div class="box-card">
                                    <span class="box-name">Sin caja</span>
                                    <span class="box-price">Gratis</span>
                                </div>
                            </label>
                            <label class="box-option">
                                <input type="radio" name="box" value="basic">
                                <div class="box-card">
                                    <span class="box-name">Caja 1 - Básica</span>
                                    <span class="box-price">+€3</span>
                                </div>
                            </label>
                            <label class="box-option">
                                <input type="radio" name="box" value="black">
                                <div class="box-card">
                                    <span class="box-name">Caja 2 - Negra</span>
                                    <span class="box-price">+€5</span>
                                </div>
                            </label>
                            <label class="box-option">
                                <input type="radio" name="box" value="brown">
                                <div class="box-card">
                                    <span class="box-name">Caja 3 - Negra / Marrón</span>
                                    <span class="box-price">+€5</span>
                                </div>
                            </label>
                            <label class="box-option">
                                <input type="radio" name="box" value="seiko">
                                <div class="box-card">
                                    <span class="box-name">Caja 4 - Seiko + Tarjetas</span>
                                    <span class="box-price">+€10</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="actions-block" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                        <div class="quantity-selector">
                            <button id="qty-minus">-</button>
                            <input type="number" id="qty-input" value="1" min="1" max="10">
                            <button id="qty-plus">+</button>
                        </div>
                        <button id="add-to-cart-btn" class="btn-add-cart-lg">
                            Añadir al Carrito
                        </button>
                    </div>
                </div>
            </section>
        </div>


        <section class="related-products">
            <h2>También te podría gustar</h2>
            <div class="catalogo-carousel" id="related-carousel">
                <div class="carousel-container">
                    <div class="carousel-track" id="related-track">
                        
                    </div>
                </div>
                <div class="carousel-arrows">
                    <button class="carousel-arrow carousel-arrow-left" id="related-prev">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="carousel-arrow carousel-arrow-right" id="related-next">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>


    <div class="size-guide-modal" id="size-guide-modal">
        <div class="size-guide-overlay"></div>
        <div class="size-guide-content">
            <button class="size-guide-close" id="size-guide-close">
                <i class="fas fa-times"></i>
            </button>
            <h3>Guía de Tallas</h3>
            <img id="size-guide-image" src="" alt="Guía de Tallas" />
        </div>
    </div>


    <div class="image-lightbox" id="image-lightbox">
        <div class="lightbox-overlay" id="lightbox-overlay"></div>
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="lightbox-content">
            <div class="lightbox-image-wrapper" id="lightbox-wrapper">
                <img id="lightbox-image" src="" alt="Imagen ampliada">
            </div>
        </div>
        <button class="lightbox-nav lightbox-next" id="lightbox-next">
            <i class="fas fa-chevron-right"></i>
        </button>




        <div class="lightbox-thumbnails" id="lightbox-thumbnails">

        </div>
    </div>


    <div id="footer-placeholder"></div>


    <script src="/js/theme.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/ux-feedback.js"></script>

    <script type="module" src="/js/producto.js"></script>
    <script type="module" src="/js/carrito.js"></script>
    <script src="/js/image-protection.js"></script>
    <script src="/js/cajas-modal.js"></script>

    
    <div class="boxes-modal" id="boxes-modal">
        <div class="boxes-modal-overlay"></div>
        <div class="boxes-modal-content">
            <button class="boxes-modal-close" id="boxes-modal-close" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
            <img src="/assets/images/cajas.png" alt="Tipos de Cajas" class="boxes-modal-img">
        </div>
    </div>
</body>

</html>
